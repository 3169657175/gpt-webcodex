<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;">
  <title>网页 MCP 助手</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <header class="browser-toolbar">
    <div class="toolbar-main">
      <div class="nav-actions">
        <button id="backButton" class="icon-button" title="后退" disabled>←</button>
        <button id="forwardButton" class="icon-button" title="前进" disabled>→</button>
        <button id="reloadButton" class="icon-button" title="刷新">↻</button>
        <button id="homeButton" class="home-button"><span class="logo-mark">AI</span><b>ChatGPT</b></button>
      </div>
      <div class="page-state" id="pageState"><i></i><span>正在准备 ChatGPT…</span></div>
      <div class="service-state">
        <span id="downloadState" class="download-state"></span>
        <button id="openDownloadButton" class="download-action" type="button" hidden>打开附件</button>
        <span id="mcpState" title="Coding Tools MCP 本地服务状态"><i></i>本地工具</span>
        <span id="tunnelState" title="OpenAI Tunnel 连接状态"><i></i><em id="connectionStateLabel">连接通道</em></span>
        <button id="schemaRefreshHint" class="schema-refresh-hint" type="button" hidden title="当前聊天仍使用旧版工具定义；点击可暂时关闭此提示">工具已更新 · 建议新建聊天 ×</button>
        <button id="nativeLoginButton" class="login-action login-entry" type="button" title="打开登录中心：优先在应用内登录，成功后自动返回">登录 / 登录帮助</button>
        <button id="managerButton" class="manager-button">设置</button>
      </div>
    </div>
    <div class="workspace-bar">
      <div class="workspace-label" id="workspaceLabel">
        <span>当前工作区</span><strong id="activeWorkspace">未选择</strong>
        <button id="workspaceHealthButton" class="workspace-health-button" type="button" aria-label="查看工作区同步状态" aria-expanded="false"><i></i></button>
        <div id="workspaceHealthPopover" class="workspace-health-popover" hidden>
          <b id="workspaceHealthName">未选择工作区</b>
          <code id="workspaceHealthPath">-</code>
          <div><span>状态</span><strong id="workspaceHealthState">等待检查</strong></div>
          <div><span>最近检查</span><strong id="workspaceHealthTime">-</strong></div>
        </div>
      </div>
      <div class="task-strip idle" id="taskStrip">
        <i></i><b id="taskStatusLabel">空闲</b><small id="taskTitle">暂无任务</small>
        <button id="stopTask" type="button" hidden>停止</button>
      </div>
      <div class="workspace-picker" id="workspacePicker">
        <button id="workspacePickerButton" class="workspace-select" type="button" aria-expanded="false" title="打开独立工作区中心">全部工作区</button>
      </div>
      <div id="switchState" class="switch-state"></div>
      <button id="addAuthorizedRootQuick" class="add-workspace secondary-action" title="授权一个额外目录，无需切换主工作区">＋ 授权目录</button>
      <button id="addWorkspace" class="add-workspace">＋ 添加工作区</button>
    </div>
    <div class="progress-band" id="progressBand" aria-live="polite">
      <div class="progress-detail-trigger" id="progressDetailTrigger" role="button" tabindex="0" aria-expanded="false" aria-label="悬停或按 Enter 查看详细运行状态">
        <span class="progress-band-icon" id="progressIcon"></span>
        <div class="progress-band-copy"><b id="progressMessage">正在读取任务进度…</b><small id="progressDetail">本地任务状态会持续更新</small></div>
      </div>
      <time id="progressElapsed"></time>
      <button id="activityToggle" class="progress-action activity-toggle" type="button" aria-expanded="false" hidden>活动详情</button>
      <button id="progressAction" class="progress-action" type="button" hidden></button>
      <button id="nativeLoginFinish" class="login-action" type="button" hidden>登录完成，返回助手</button>
      <button id="nativeLoginCancel" class="login-action secondary" type="button" hidden>取消登录</button>
    </div>
  </header>
  <main class="loading-stage">
    <div class="loading-card"><div class="spinner"></div><h1>正在打开 ChatGPT</h1><p>聊天页面与本地工作区权限相互隔离。</p></div>
  </main>
  <dialog id="loginDialog" class="login-dialog" aria-labelledby="loginDialogTitle" aria-describedby="loginDialogMessage">
    <div class="login-dialog-badge" id="loginDialogBadge">CHATGPT · 登录中心</div>
    <h1 id="loginDialogTitle">在助手内登录 ChatGPT</h1>
    <p id="loginDialogMessage">直接在应用内登录，成功后自动返回聊天。</p>
    <div class="login-dialog-steps" id="loginDialogSteps"><span>1 选择登录方式</span><span>2 完成账号验证</span><span>3 自动返回聊天</span></div>
    <button id="embeddedLoginStart" class="login-dialog-primary" type="button">在应用内继续登录</button>
    <button id="loginBrowserFallback" class="login-dialog-secondary" type="button">应用内遇到问题？使用 Chrome 备用登录</button>
    <button id="loginCheckNow" class="login-dialog-primary" type="button" hidden>我已登录，立即检查</button>
    <div class="login-dialog-note" id="loginDialogNote">登录过程使用助手自己的会话，不读取其他软件或日常浏览器中的账号。</div>
    <button id="loginDialogCancel" class="login-dialog-cancel" type="button">暂不登录，返回页面</button>
  </dialog>
  <script src="progressPresentation.js"></script>
  <script src="assistantState.js"></script>
  <script src="browser.js"></script>
</body>
</html>
